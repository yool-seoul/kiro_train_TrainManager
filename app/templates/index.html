{% extends "base.html" %}
{% block content %}
<section class="card">
  <h1>열차 좌석 조회 · 예약</h1>
  <form id="search-form"
        hx-post="/search"
        hx-target="#results"
        hx-swap="innerHTML"
        hx-indicator="#loading"
        hx-disabled-elt="#search-btn"
        data-status="#search-state">
    <div class="grid">
      <label>열차
        {# 열차 종류를 바꾸면 계정 + 역 드롭다운을 갱신한다 #}
        <select name="train_type" id="train-type-select"
                hx-get="/accounts"
                hx-target="#cred-select"
                hx-swap="innerHTML"
                hx-trigger="change">
          {% for t in train_types %}
          <option value="{{ t.value }}">{{ t.value|upper }}</option>
          {% endfor %}
        </select>
      </label>
      <label>출발역
        <select name="dep" id="dep-select">
          {% for s in stations %}
          <option value="{{ s }}" {{ "selected" if s == default_dep else "" }}>{{ s }}</option>
          {% endfor %}
        </select>
      </label>
      <label>도착역
        <select name="arr" id="arr-select">
          {% for s in stations %}
          <option value="{{ s }}" {{ "selected" if s == default_arr else "" }}>{{ s }}</option>
          {% endfor %}
        </select>
      </label>
      <label>날짜 <input type="date" name="date" value="{{ default_date }}" required></label>
      <label>시각 <input type="time" name="time" value="{{ default_time }}" required></label>
      <label>좌석
        <select name="seat_class">
          <option value="all" selected>모두</option>
          <option value="general">일반실</option>
          <option value="special">특실</option>
        </select>
      </label>
      <label>어른 <input type="number" name="adults" value="1" min="0" max="9"></label>
      <label>어린이 <input type="number" name="children" value="0" min="0" max="9"></label>
      <label>경로 <input type="number" name="seniors" value="0" min="0" max="9"></label>
      <label>계정
        <select name="credential_label" id="cred-select">
          {% include "partials/account_options.html" %}
        </select>
      </label>
    </div>
    <div class="actions">
      <button id="search-btn" type="submit">조회</button>
      <span id="loading" class="htmx-indicator">⏳ 응답 대기 중…</span>
    </div>
    {# 조회 요청의 상태를 명시적으로 구분해서 보여준다 (공용 패턴: base.html) #}
    <div id="search-state" class="req-state state-idle" aria-live="polite">
      아직 조회하지 않았습니다. 조건을 입력하고 <b>조회</b>를 누르세요.
    </div>
  </form>
</section>

<section id="results"></section>

<script>
// 열차 종류별 기본 출발역/도착역
var defaultStations = {ktx: {dep: '서울', arr: '울산(통도사)'}, srt: {dep: '수서', arr: '울산(통도사)'}};

// 열차 종류 변경 시 출발역/도착역 드롭다운을 해당 열차 역 목록으로 갱신
document.getElementById('train-type-select').addEventListener('change', function() {
  const trainType = this.value;
  fetch('/stations?train_type=' + encodeURIComponent(trainType))
    .then(r => r.text())
    .then(html => {
      const depSel = document.getElementById('dep-select');
      const arrSel = document.getElementById('arr-select');
      depSel.innerHTML = html;
      arrSel.innerHTML = html;
      // 기본역 설정
      var defs = defaultStations[trainType] || {};
      if (defs.dep && [...depSel.options].some(o => o.value === defs.dep)) depSel.value = defs.dep;
      if (defs.arr && [...arrSel.options].some(o => o.value === defs.arr)) arrSel.value = defs.arr;
    });
});
</script>
{% endblock %}
